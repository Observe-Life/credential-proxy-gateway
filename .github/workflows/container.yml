name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/observe-life/ssh-connector-mcp

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify owner via ServerChan
        if: ${{ always() }}
        continue-on-error: true
        env:
          SERVERCHAN_NOTIFY_URL: ${{ secrets.SERVERCHAN_NOTIFY_URL }}
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.parse
          endpoint = os.environ.get("SERVERCHAN_NOTIFY_URL", "")
          if not endpoint:
              print("Notification secret is not configured")
              raise SystemExit(0)
          status = os.environ["BUILD_STATUS"]
          title = "凭证代理保险箱构建：" + {"success":"成功", "failure":"失败", "cancelled":"取消"}.get(status, status)
          body = urllib.parse.urlencode({"title":title, "desp":"构建结果："+status+"\n提交："+os.environ["BUILD_COMMIT"]+"\n详情："+os.environ["RUN_URL"]}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(endpoint, data=body), timeout=20) as response:
                  print("Notification HTTP status:", response.status)
          except Exception:
              print("Notification delivery failed; check service availability")
              raise SystemExit(1)
          PY
