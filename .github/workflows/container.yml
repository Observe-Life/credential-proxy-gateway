name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/observe-life/credential-proxy-gateway

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify owner via ServerChan
        if: ${{ always() }}
        continue-on-error: true
        env:
          SERVERCHAN_NOTIFY_URL: ${{ secrets.SERVERCHAN_NOTIFY_URL }}
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error, time
          endpoint = os.environ.get("SERVERCHAN_NOTIFY_URL", "")
          if not endpoint:
              print("Notification secret is not configured")
              raise SystemExit(1)
          status = os.environ["BUILD_STATUS"]
          title = "凭证统一代理网关构建：" + {"success":"成功", "failure":"失败", "cancelled":"取消"}.get(status, status)
          body = urllib.parse.urlencode({"title":title, "desp":"构建结果："+status+"\n提交："+os.environ["BUILD_COMMIT"]+"\n详情："+os.environ["RUN_URL"]}).encode()
          for attempt in range(3):
              try:
                  request = urllib.request.Request(endpoint, data=body, headers={"User-Agent":"credential-proxy-gateway-notifier/1.0","Content-Type":"application/x-www-form-urlencoded"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.loads(response.read())
                      if result.get("code") != 0 or result.get("errno",0) != 0:
                          print("Notification rejected: code",result.get("code"),"errno",result.get("errno"))
                          raise ValueError("notification rejected")
                      print("Notification accepted; pushid:",result.get("data",{}).get("pushid"))
                      break
              except urllib.error.HTTPError as error:
                  print("Notification HTTP error:", error.code)
              except Exception as error:
                  print("Notification attempt failed:", type(error).__name__)
              if attempt == 2:
                  raise SystemExit(1)
              time.sleep(3 * (attempt + 1))
          PY
