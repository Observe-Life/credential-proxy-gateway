[package]
name = "ssh-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.32"
getrandom = "0.4.2"
rmcp = { version = "1.7.0", features = ["server", "transport-streamable-http-server", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
russh = "0.61.2"
russh-sftp = "2.3.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
vt100 = "0.16.2"
zeroize = { version = "1.8.2", features = ["derive"] }

# Local patch: the MCP Streamable HTTP spec requires a request that carries an
# `Mcp-Session-Id` for a terminated or unknown session to be answered with
# `404 Not Found`, so the client starts a new session (re-initializes).
# Upstream rmcp maps that case to `500` (still true through rmcp 3.5.1), which
# makes standard clients break permanently instead of recovering.
# Patch branch: https://github.com/Observe-Life/rust-sdk (rmcp-v1.7.0-session-404)
# Retire this patch once upstream returns 404 for terminated sessions itself.
[patch.crates-io]
rmcp = { git = "https://github.com/Observe-Life/rust-sdk", rev = "026306469db833e9f0b524c5cdab757576c070f3" }
